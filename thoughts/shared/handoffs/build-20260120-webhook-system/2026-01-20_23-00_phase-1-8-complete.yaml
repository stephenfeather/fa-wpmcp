  - AbilityExecutor at src/Abilities/AbilityExecutor.php:27 orchestrates full execution pipeline integrating permissions, rate limiting, logging, webhooks
  - Pipeline flow: validateInput → checkPermissions → checkRateLimit → logBefore → fireBeforeWebhook → executeAbility → logAfter → fireAfterWebhook
  - Short-circuit behavior: Pipeline stops on first Result::failure()
  - Context passing: Each pipeline step receives and returns context array with ability, input, output, correlation_id, start_time

