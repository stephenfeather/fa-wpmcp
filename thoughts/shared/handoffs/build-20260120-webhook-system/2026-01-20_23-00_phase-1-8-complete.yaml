architecture_notes:
  - ExecutionPipeline at src/Abilities/ExecutionPipeline.php:18 uses functional composition with array_reduce
  - Pipeline immutability ensures predictable behavior and thread safety
  - AbstractAbility at src/Abilities/AbstractAbility.php:20 provides template pattern for ability implementations
