decisions:
  - pure_functional_core: PayloadBuilder, SignatureGenerator, and RetryCalculator are pure functions (no side effects, deterministic) for easy testing
  - interface_based_boundaries: WebhookQueue, WebhookSender, and WebhookConfig are interfaces - enables dependency injection and mocking
  - immutable_value_objects: WebhookPayload and WebhookResult use PHP 8.1 readonly properties for true immutability
  - hmac_sha256_signatures: HMAC-SHA256 with timing-safe comparison (hash_equals) to prevent timing attacks
  - exponential_backoff_retry: Failed webhooks retry with exponential backoff (60s, 120s, 240s) then permanently fail after 3 attempts
  - database_queue_implementation: DatabaseWebhookQueue uses wp_fa_wpmcp_webhook_queue table with url column
  - action_scheduler_primary: Use Action Scheduler as primary with runtime availability check via function_exists()
  - wp_cron_fallback: Graceful degradation to WP-Cron if Action Scheduler unavailable
  - five_minute_interval: Process webhook queue every 5 minutes (300 seconds)
  - ability_lifecycle_hooks: WebhookService listens to fa_wpmcp_ability_before_execute, fa_wpmcp_ability_after_execute, fa_wpmcp_ability_failed

findings:
  - url_column_needed: Original Phase 1.3 schema didn't have url column - webhooks need to know where to send
  - wpdb_prepare_table_names: PHPCS requires table names outside of prepare() but allows disable comments when table is constructed safely (following LogRepository pattern)
  - wp_remote_post_defaults: "Used 10-second timeout, blocked redirects (redirection: 0), proper headers (Content-Type, X-FA-WPMCP-Signature)"
  - random_bytes_secure: PHP random_bytes() provides cryptographically secure random for webhook secrets
  - action_scheduler_installed: Action Scheduler ^3.7 already in composer.json from Phase 1.1
  - runtime_check_needed: Must check function_exists() for Action Scheduler functions to support environments without it
  - unique_flag_prevents_duplicates: as_schedule_recurring_action() with unique=true prevents duplicate schedules

worked:
  - TDD Red-Green-Refactor approach maintained code quality throughout
  - Following established patterns from Phase 1.5/1.6 (immutability, pure functions, interfaces) accelerated development
  - Interface-first design made testing easy - no concrete implementations needed in tests
  - WebhookScheduler detects Action Scheduler availability with function_exists()
  - WebhookService acts as facade/coordinator for all webhook components
  - Morph edit tool efficiently applied changes across multiple files
  - PHPCS disable comments with rationale kept code standards clean

