architecture_notes:
  - ExecutionPipeline at src/Abilities/ExecutionPipeline.php:18 - immutable composable pipeline using array_reduce for functional composition
  - Pipeline flow: validateInput → checkPermissions → checkRateLimit → logBefore → fireBeforeWebhook → executeAbility → logAfter → fireAfterWebhook
  - Short-circuit: Pipeline stops at first Result::failure() and skips remaining steps
  - AbstractAbility at src/Abilities/AbstractAbility.php:20 - template pattern for ability implementations with pure to_registration_array() converter
  - AbilityRegistry at src/Abilities/AbilityRegistry.php:18 - central storage with filtering by category/operation, duplicate prevention
  - AbilityExecutor at src/Abilities/AbilityExecutor.php:27 - orchestrates full pipeline integrating permissions, rate limiting, logging, webhooks
  - Dependency injection: AbilityExecutor uses interfaces (ActivityLoggerInterface, WebhookManagerInterface, RateLimiterInterface) for testability
  - Context pattern: Each pipeline step receives context array and returns Result::success($context) or Result::failure($code, $message)

