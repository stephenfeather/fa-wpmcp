decisions:
  - tdd_workflow: Followed strict RED-GREEN-REFACTOR cycle - wrote 79 tests before any implementation
  - pure_functions: Separated pure transformations (buildQueryArgs, sanitizeInput, formatResults) from side effects (WP_Query, wp_insert_post)
  - ability_naming: Used "fa-wpmcp/{action}-{resource}" pattern (e.g., fa-wpmcp/get-post)
  - registry_pattern: Added Plugin::register_post_abilities() method called from init() to register all abilities at once
  - operation_types: GetPost and ListPosts are 'read', CreatePost and UpdatePost are 'write'
  - capability_mapping: Read abilities require 'read', write abilities require 'edit_posts'
  - pagination_limit: ListPosts caps per_page at 100 to prevent performance issues
  - sanitization_functions: Used sanitize_text_field for titles, wp_kses_post for content, absint for IDs

findings:
  - test_coverage_increase: Coverage jumped from 64.33% to 76.03% (+11.7%) with Phase 1.10
  - test_suite_growth: Added 80 new tests (174 → 254) and 159 new assertions (394 → 553)
  - abstract_ability_pattern: AbstractAbility.php provides excellent foundation - all 4 abilities extended it cleanly
  - brain_monkey_mocking: Brain\Monkey Functions::expect() works well for WordPress function mocking in tests
  - json_schema_validation: Input/output schemas defined but validation not yet enforced in execution pipeline
  - metadata_retrieval: GetPost includes categories, tags, featured_image_url, author info via pure transformations
  - filtering_capabilities: ListPosts supports status, author, category, search filters via WP_Query args
  - error_handling: CreatePost and UpdatePost throw RuntimeException on wp_insert_post/wp_update_post failures

worked:
  - TDD approach (RED-GREEN-REFACTOR) caught edge cases early
  - Pure function pattern for transformations keeps code testable and predictable
  - Isolation of side effects makes abilities easy to understand and maintain
  - Brain\Monkey mocking enables comprehensive unit tests without WordPress runtime
  - Registry pattern centralizes ability registration and keeps Plugin::init() clean
  - Following WordPress sanitization functions (wp_kses_post, sanitize_text_field) for security

