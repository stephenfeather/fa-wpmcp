decisions:
  - pure_function_utilities: All HTTP utilities as static pure functions (no side effects, no state)
  - final_classes: ErrorCodes, ResponseFormatter, PrivacyRedactor marked final (no inheritance)
  - case_insensitive_redaction: Field matching uses lowercase comparison for robustness
  - recursive_implementation: PrivacyRedactor handles arbitrarily nested data structures
  - transparent_integration: Redaction at logging/webhook boundaries preserves business logic
  - sensitive_fields_standard: Eight sensitive fields (password, token, api_key, secret, user_pass, apikey, access_token, refresh_token)
