implementation_guide:
  pattern_reference: src/Abilities/Posts/GetPost.php (good example to follow)
  extend: FAWpmcp\Abilities\AbstractAbility
  methods_required:
    - get_name(): return 'fa-wpmcp/{ability-name}'
    - get_category(): return 'comments'
    - get_label(): return human readable label
    - get_description(): return ability description
    - get_input_schema(): return JSON Schema for input validation
    - get_output_schema(): return JSON Schema for output format
    - get_required_capability(): return WordPress capability
    - do_execute(array $input): implement core logic

  wordpress_functions:
    - get_comments(array $args): Query comments with filters
    - get_comment(int $id): Get single comment by ID
    - wp_insert_comment(array $data): Create new comment
    - wp_set_comment_status(int $id, string $status): Update comment status
    - wp_count_comments(int $post_id = 0): Get comment counts by status
    - get_comment_link(int $id): Get permalink to comment

