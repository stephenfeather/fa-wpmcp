decisions:
  - complete_cleanup: Uninstall removes all plugin data (tables, options, transients, user meta, scheduled tasks)
  - preservation_constant: FA_WPMCP_PRESERVE_DATA_ON_UNINSTALL allows users to keep data
  - multisite_support: Uninstall handles multisite sitemeta cleanup with is_multisite() check
  - action_scheduler_compatible: Checks for as_unschedule_all_actions() before calling
  - no_logging: Uninstall doesn't log (plugin is being deleted, nowhere to log to)
  - simple_implementation: Direct wpdb queries, no dependencies on plugin classes
  - exit_early: Returns immediately if WP_UNINSTALL_PLUGIN not defined or preservation constant set

