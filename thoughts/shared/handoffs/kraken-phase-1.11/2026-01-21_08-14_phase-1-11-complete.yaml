decisions:
  - test_structure: Followed TDD RED-GREEN cycle - wrote 34 tests before implementation
  - ui_organization: Split settings into 4 tabs (Overview, Permissions, Rate Limits, Webhooks)
  - settings_storage: Store all settings in single WordPress option 'fa_wpmcp_settings' with nested structure
  - menu_structure: Main menu "FA WPMCP" with 4 submenus for each settings section
  - permission_levels: Three-tier permission system (global → category → ability)
  - asset_loading: Enqueue CSS/JS only on plugin admin pages using screen ID check
  - security_approach: Separate nonce/capability verification for each settings form
  - form_handling: Each settings section has dedicated save handler (handle_*_save methods)

