architecture_notes:
  - SettingsPage initialized in Plugin::init() at src/Plugin.php:77-79
  - Settings stored in WordPress option 'fa_wpmcp_settings' with structure:
      permissions: {global_read, global_write, categories: {}, abilities: {}}
      rate_limits: {global: {per_minute, per_hour}, abilities: {}}
      webhooks: {endpoint_url, secret, events: []}
  - Four admin pages: Overview (toplevel_page_fa-wpmcp), Permissions, Rate Limits, Webhooks
  - Each settings section has dedicated render method and save handler
  - Security implemented via wp_verify_nonce() and current_user_can('manage_options')
  - Assets enqueued only when get_current_screen()->id matches plugin page IDs
  - Admin notices displayed via $_GET['settings-updated'] parameter and admin_notices hook

