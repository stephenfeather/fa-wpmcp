decisions:
  - php_version: Updated from 8.0 to 8.1 for readonly property support (validation found this issue)
  - wordpress_abilities_api_version: Using ^0.5 (v0.5.0-rc available, not 1.0 yet)
  - mcp_adapter_version: Using ^0.4 (v0.4.1 available)
  - minimum_stability: Set to "RC" to allow release candidate dependencies
  - tdd_approach: Full Red-Green-Refactor cycle for all phases with pure functions and immutability
  - function_naming: Using snake_case for methods (WordPress standards) despite FP preference for camelCase

findings:
  - Brain Monkey cannot mock function_exists without special patchwork.json config - rewrote tests to avoid this
  - WordPress PHPCS filename rules conflict with PSR-4 - excluded src/ and tests/ directories from WordPress.Files.FileName checks
  - Pure functional approach works well in WordPress context when balanced with pragmatic side effects (DB, hooks, logging)
  - Result monad pattern provides clean error handling without exceptions
  - Readonly properties in PHP 8.1 enable true immutability for value objects

worked:
  - TDD Red-Green-Refactor cycle maintains code quality
  - Pure functions for business logic (Schema, Migrator, PermissionChecker) are easy to test
  - Immutable value objects (Result, PermissionSettings) prevent bugs
  - Dependency injection via service container enables future flexibility
  - Running composer phpcbf auto-fixes most coding standards issues

failed:
  - Initial attempt to use WordPress Abilities API ^1.0 (doesn't exist yet, only 0.5.0-rc)
  - Trying to mock function_exists with Brain Monkey (requires patchwork.json config we decided not to add)

