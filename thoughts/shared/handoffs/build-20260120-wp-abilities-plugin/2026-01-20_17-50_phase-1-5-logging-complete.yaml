decisions:
  - snake_case_naming: Refactored all properties and methods from camelCase to snake_case for WordPress coding standards compliance
  - phpcs_disable_blocks: Used phpcs:disable/enable blocks instead of single-line ignore comments to suppress false positive warnings about table name interpolation in LogRepository
  - repository_not_final: Removed final keyword from LogRepository to allow Mockery to create mocks in tests
  - explicit_assertions: Added explicit assertions to all ActivityLogger tests (previously relied only on Mockery expectations which caused "risky" warnings)

findings:
  - key_pattern_immutability: PHP 8.1 readonly properties enable true immutability for value objects without magic methods
  - builder_pattern_works_well: Immutable builder pattern fits functional programming approach while maintaining ergonomic API
  - phpcs_table_name_false_positives: PHPCS WordPress.DB.PreparedSQL rules flag safe class property interpolation as violations - requires disable blocks
  - yoda_conditions_required: WordPress standards require Yoda conditions in comparisons (true === $value instead of $value === true)
  - repository_pattern_clean_separation: Isolating side effects to repository layer makes pure business logic easy to test

worked:
  - TDD Red-Green-Refactor cycle maintained code quality throughout
  - morph-mcp edit_file tool efficiently handled systematic refactoring across multiple files
  - phpcs:disable/enable blocks successfully suppressed false positive warnings
  - Mockery mocking worked well after removing final keyword from repository

failed:
  - Initial single-line phpcs:ignore comments didn't suppress multi-line violations - needed disable/enable blocks
  - First attempt had LogRepository as final class preventing Mockery from mocking it
  - Initial tests were "risky" with only Mockery expectations - needed explicit assertions

