decisions:
  - mcp_route_versioning: "Use versioned route /wp-json/fa-wpmcp/v1/mcp to allow future breaking changes"
  - server_id: "Standardized to fa-wpmcp matching plugin slug and WordPress conventions"
  - rate_limiting_strategy: "Dual tracking by user ID and IP hash to prevent both single-user and distributed abuse"
  - background_jobs: "Action Scheduler primary with WP-Cron fallback for webhook queue processing"
  - multisite_support: "Phase 1 explicitly single-site only, activate check prevents multisite install"
  - permission_model: "Multi-level hierarchy - global → category → ability with custom fa_wpmcp_* capabilities"
  - authentication: "Dedicated service accounts (ai-agent-{identifier}) with Application Password rotation every 30 days"

findings:
  - abilities_api_hooks: "Categories must register on wp_abilities_api_categories_init before abilities on wp_abilities_api_init"
  - json_schema_validation: "Abilities API handles input validation, plugin adds additional sanitization in execute callbacks"
  - correlation_ids_essential: "UUID v4 correlation IDs required for tracing across logs, webhooks, and external systems"
  - application_password_auditing: "Use application_password_did_authenticate hook to log all auth events"
  - rate_limit_storage: "Transients work for rate limiting but custom table required for webhook queue reliability"
  - error_taxonomy: "Must use standardized error codes (authentication_required, insufficient_permissions) not rest_forbidden"

